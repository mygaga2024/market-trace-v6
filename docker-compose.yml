services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt6-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    network_mode: host
    env_file: ./env
    environment:
      - TZ=Asia/Shanghai
      - MT6_DATA_DIR=/app/data/go
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

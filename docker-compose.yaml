services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt6-app
    restart: unless-stopped
    network_mode: host
    env_file: ./env
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Market Trace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css?v=2.2.0">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="login-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M8 12h8M3 12h18"></path></svg>
      </span>
      <div><strong>Market Trace</strong><span>量化控制中心</span></div>
    </div>
    <div class="login-copy">
      <span class="eyebrow">SECURE ACCESS</span>
      <h1>登录工作台</h1>
      <p>账户会话与管理权限由 NAS 本地保存。手机登录后也可扫码授权桌面登录。</p>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="登录方式">
      <button class="auth-tab active" type="button" role="tab" aria-selected="true" data-auth-tab="password">账号登录</button>
      <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-tab="qr">扫码登录</button>
    </div>

    <section class="auth-pane active" data-auth-pane="password">
      <form id="login-form">
        <input name="username" type="text" value="operator" autocomplete="username" hidden>
        <label class="field">
          <span>用户名</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="用户名、邮箱或手机号" required>
        </label>
        <label class="field auth-field-gap">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入账户密码" required>
        </label>
        <p class="form-error" id="login-error" hidden>用户名或密码错误。</p>
        <button class="button button-primary login-submit" type="submit">进入控制中心</button>
      </form>
      <p class="auth-switch">还没有账户？<a href="/register">立即注册</a></p>
    </section>

    <section class="auth-pane" data-auth-pane="qr">
      <div class="qr-panel">
        <span class="qr-mark" id="qr-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM19 19h1v1h-1zM14 19h2M19 14h1"></path></svg>
        </span>
        <div class="qr-image-wrap" id="qr-image-wrap" hidden><img id="qr-image" alt="应用内扫码登录二维码"></div>
        <h2 id="qr-title">应用内扫码登录</h2>
        <p id="qr-status">点击生成二维码，再用已登录 Market Trace 的手机扫描确认。</p>
        <button class="button button-primary" id="qr-login-button" type="button">生成二维码</button>
        <small>二维码 3 分钟有效且只能使用一次。扫码登录继承该账户的权限，包括已开启的交易权限。</small>
      </div>
      <p class="auth-switch">手机端需要先登录同一套 Market Trace 服务。</p>
    </section>

    <p class="login-foot">登录会话默认 7 天 · 密码使用 Argon2id 加盐存储</p>
  </main>
  <script src="/assets/login.js?v=2.2.0" defer></script>
</body>
</html>
